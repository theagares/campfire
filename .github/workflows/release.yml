name: Build desktop installers (draft release)

# 수동 실행(workflow_dispatch)으로 Windows/macOS 설치 파일을 electron-builder 로 빌드해
# GitHub Releases에 "초안(draft)"으로 올린다 — 초안은 저장소 밖에 공개되지 않으므로
# 실제로 공개 배포하려면 Releases 페이지에서 사람이 직접 "Publish"를 눌러야 한다.
#
# Windows 로컬(개발자 PC, 비관리자 세션)에서는 electron-builder 가 코드사이닝 도구 묶음
# (winCodeSign, macOS dylib 심볼릭 링크 포함)을 내려받다 "Cannot create symbolic link"로
# 실패한다(심볼릭 링크 생성엔 관리자 권한/개발자 모드 필요) — GitHub 호스팅 러너는 이 제약이
# 없어 빌드가 정상적으로 된다.
#
# 엔진 Python 런타임은 stdlib venv(python -m venv) 대신 uv 가 관리하는 portable Python
# (python-build-standalone)을 그대로 복사해서 번들한다. stdlib venv 는 Windows에서
# Scripts/python.exe 가 pyvenv.cfg 의 home(빌드 머신 전용 절대경로)을 찾는 런처 스텁이고,
# mac/linux 는 bin/python 이 그 절대경로를 가리키는 심볼릭 링크라 — 둘 다 다른 머신에
# 설치하면 실행이 안 된다(실측 확인됨: "No Python at ...". portable 빌드는 자기 완결적이라
# 폴더째 복사해도 그대로 동작한다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv
        shell: bash
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up portable engine runtime (extraResources 로 앱에 번들됨)
        working-directory: engine
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.11
          PYEXE=$(uv python find 3.11)
          echo "uv managed python: $PYEXE"
          rm -rf .venv
          if [[ "$PYEXE" == *.exe ]]; then
            # Windows: uv 배포본은 <root>/python.exe 플랫 레이아웃
            PYROOT=$(dirname "$PYEXE")
            cp -r "$PYROOT" .venv
          else
            # macOS/Linux: uv 배포본은 <root>/bin/python3.x 레이아웃. uv 는 버전 별칭 경로
            # 자체가 실제 설치 디렉터리를 가리키는 심볼릭 링크라(예: cpython-3.11-...) 그냥
            # cp -R 만 하면 "복사본"이 실제로는 러너 전용 캐시 경로를 가리키는 심볼릭 링크로
            # 그대로 남아 다른 머신(사용자 Mac)에서 못 찾는다(실측 확인됨) — -L 로 실제
            # 내용을 완전히 역참조해서 복사해야 진짜로 자기 완결적인 사본이 된다.
            PYROOT=$(dirname "$(dirname "$PYEXE")")
            cp -RL "$PYROOT" .venv
            ln -sf "$(basename "$PYEXE")" .venv/bin/python
          fi
          # uv 가 관리하던 원본 설치는 PEP 668 "externally-managed" 마커가 있어 pip install 을
          # 거부한다 — 복사본은 어차피 이 빌드 전용 일회성 사본이니 마커를 지우고 무시한다.
          find .venv -name EXTERNALLY-MANAGED -delete
          if [ -f .venv/python.exe ]; then PY=.venv/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install --upgrade pip --break-system-packages
          "$PY" -m pip install -e . --break-system-packages

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build & upload as draft release asset
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder 자체 코드사이닝 탐색은 양쪽 다 끈다: Windows 는 코드사이닝
          # 도구(winCodeSign, macOS dylib 심볼릭 링크 포함)를 내려받다 실패하는 문제 회피용,
          # macOS 는 어차피 진짜 인증서가 없어 electron-builder 자체 탐색은 늘 실패로
          # 끝나고(경고만 찍고 무서명으로 통과) 실제 서명은 afterPack 훅(scripts/afterPack.js)
          # 이 담당한다(package.json _comment_mac_signing 참고).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }} -- --publish always

      # 빌드가 "성공"해도 번들된 엔진이 실제로 뜨는지는 별개 문제였다(portable Python
      # 전환의 원인이 된 버그) — 설치 파일을 실제로 설치/실행해 /health 를 확인한다.
      - name: Verify installed app can start the bundled engine (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem -Path "desktop\release" -Filter "*Setup*.exe" -Recurse | Select-Object -First 1
          if (-not $setupExe) { Write-Error "설치 파일을 찾지 못했습니다"; exit 1 }
          $installProc = Start-Process -FilePath $setupExe.FullName -ArgumentList "/S" -Wait -PassThru
          Write-Output "설치 프로세스 종료 코드: $($installProc.ExitCode)"
          Write-Output "--- %LOCALAPPDATA%\Programs 내용(설치 직후) ---"
          Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
          # NSIS /S 는 -Wait 로 잡히는 런처 프로세스가 실제 설치 작업을 마치기 전에 먼저
          # 끝나버릴 때가 있다(관측된 간헐적 실패 — 러너별 부하에 따라 60초로도 부족한
          # 경우가 실측 확인됨). 180초로 더 여유를 둔다. 그래도 못 찾으면 설치 프로세스
          # 종료 코드/디렉터리 목록을 위에서 이미 남겼으니 설치 자체가 실패했는지
          # 단순히 느린 건지 로그로 구분할 수 있다.
          $appExe = "$env:LOCALAPPDATA\Programs\UpSecurity\UpSecurity.exe"
          $deadline = (Get-Date).AddSeconds(180)
          while (-not (Test-Path $appExe) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $appExe)) {
            Write-Output "--- %LOCALAPPDATA%\Programs 내용(대기 종료 시점) ---"
            Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
            Write-Error "설치된 실행파일을 찾지 못했습니다: $appExe"
            exit 1
          }
          Start-Process -FilePath $appExe
          # 최초 실행 시 Windows Defender 실시간 검사가 방금 설치된 대용량 엔진 번들
          # (torch 등 수천 개 파일)을 스캔하느라 /health 가 뜨기까지 몇 분씩 걸리는
          # 경우가 실측 확인됐다(짧은 단발성 스캔 대신 5분간 5초 간격으로 재시도).
          $ok = $false
          $healthDeadline = (Get-Date).AddSeconds(300)
          while (-not $ok -and (Get-Date) -lt $healthDeadline) {
            foreach ($port in 48200..48209) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$port/health" -TimeoutSec 2 -UseBasicParsing
                if ($resp.StatusCode -eq 200) { Write-Output "엔진 정상: 포트 $port, $($resp.Content)"; $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) { Write-Error "엔진 /health 응답을 받지 못했습니다(포트 48200-48209, 5분 대기)"; exit 1 }

      - name: Verify packaged app can start the bundled engine (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          echo "runner arch: $(arch), uname -m: $(uname -m)"
          # arm64 러너에서 x64 빌드(Rosetta 변환 필요)를 테스트하면 변수가 하나 더 생기니,
          # 먼저 네이티브 arm64 빌드로 격리해서 확인한다.
          APP=$(find desktop/release/mac-arm64 -maxdepth 1 -iname "*.app" | head -1)
          if [ -z "$APP" ]; then APP=$(find desktop/release -maxdepth 3 -iname "*.app" | head -1); fi
          if [ -z "$APP" ]; then echo "빌드된 .app 을 찾지 못했습니다"; exit 1; fi
          echo "실행: $APP"
          file "$APP/Contents/MacOS/UpSecurity" || true
          RES="$APP/Contents/Resources/engine"

          echo "--- codesign/gatekeeper 상태 ---"
          codesign -dv --verbose=4 "$APP" 2>&1 || true
          spctl -a -v "$APP" 2>&1 || true

          echo "--- 엔진을 Electron 없이 직접 실행해서 원인 격리 ---"
          (cd "$RES" && ./.venv/bin/python -m app.main > /tmp/engine-direct.log 2>&1 &)
          sleep 6
          echo "direct engine log (len=$(wc -c < /tmp/engine-direct.log)):"
          cat /tmp/engine-direct.log || true
          for port in $(seq 48200 48209); do
            if curl -sf "http://127.0.0.1:$port/health"; then echo "direct engine healthy on port $port"; break; fi
          done
          pkill -f "app.main" 2>/dev/null || true
          sleep 1

          echo "--- Electron 앱 실행 ---"
          log show --predicate 'eventMessage contains "UpSecurity"' --style compact --last 1m > /tmp/before.log 2>&1 || true
          "$APP/Contents/MacOS/UpSecurity" > /tmp/upsec-app.log 2>&1 &
          APP_PID=$!
          for i in 1 2 3 4 5 6; do
            sleep 2
            echo "[t=${i}x2s] process tree:"
            ps -eo pid,ppid,stat,comm | grep -i upsecurity | grep -v grep || echo "  (none)"
          done
          echo "--- app stdout/stderr (len=$(wc -c < /tmp/upsec-app.log)) ---"
          cat /tmp/upsec-app.log || true
          echo "--- process check ---"
          ps aux | grep -i -E "upsecurity|python" | grep -v grep || echo "(no matching process)"
          kill -0 "$APP_PID" 2>/dev/null && echo "electron main pid $APP_PID alive" || echo "electron main pid $APP_PID NOT alive"
          echo "--- crash reports ---"
          find "$HOME/Library/Logs/DiagnosticReports" -iname "*upsecurity*" -o -iname "*electron*" 2>/dev/null | while read -r f; do echo "== $f =="; cat "$f"; done
          echo "--- unified log (last 1 min, mentions UpSecurity) ---"
          log show --predicate 'eventMessage contains "UpSecurity" OR processImagePath contains "UpSecurity"' --style compact --last 1m 2>&1 | tail -100 || true
          ok=0
          for port in $(seq 48200 48209); do
            if curl -sf "http://127.0.0.1:$port/health"; then ok=1; echo "엔진 정상: 포트 $port"; break; fi
          done
          if [ "$ok" -ne 1 ]; then echo "엔진 /health 응답을 받지 못했습니다(포트 48200-48209)"; exit 1; fi
