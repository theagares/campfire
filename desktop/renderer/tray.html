<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>UpSecurity</title>
  <style>
    :root, [data-theme="light"] {
      --bg:rgba(255,255,255,.92); --ink:#191F28; --ink-mute:#8B95A1; --line:#E5E8EB;
      --signal:#3182F6; --ok:#12B886; --danger:#F04452; --warn:#FF9500;
      --pii:#8B5CF6; --inj:#EC4899; --sunken:#F2F4F6;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:rgba(31,31,36,.92); --ink:#F2F4F6; --ink-mute:#6B7684; --line:#2E2E35;
        --signal:#4C8DFF; --ok:#28C08A; --danger:#FF5C6C; --warn:#FFB020; --pii:#A78BFA; --inj:#F472B6; --sunken:#26262C; }
    }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:transparent; }
    body { font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
      color:var(--ink); font-size:13px; padding:8px; }
    .pop { background:var(--bg); backdrop-filter:blur(20px); border:1px solid var(--line);
      border-radius:16px; padding:14px; box-shadow:0 12px 40px rgba(0,0,0,.28); }
    .row { display:flex; align-items:center; justify-content:space-between; }
    .title { font-weight:800; font-size:14px; }
    .title span { color:var(--signal); }
    .sec { display:flex; align-items:center; gap:8px; font-weight:600; }
    .switch { position:relative; width:42px; height:24px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; background:#c9ccd1; border-radius:999px; transition:.2s; cursor:pointer; }
    .slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
    input:checked + .slider { background:var(--ok); }
    input:checked + .slider:before { transform:translateX(18px); }
    .divider { height:1px; background:var(--line); margin:12px 0; }
    .pill { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:10px; background:var(--sunken); margin-bottom:6px; }
    .pill .nm { font-weight:600; }
    .pill .st { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-mute); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--ink-mute); }
    .dot.on { background:var(--ok); } .dot.off { background:var(--danger); }
    .res { display:flex; align-items:center; gap:8px; margin:6px 0; }
    .res .l { width:42px; font-size:12px; color:var(--ink-mute); font-weight:600; }
    .track { flex:1; height:6px; background:var(--sunken); border-radius:999px; overflow:hidden; }
    .fill { height:100%; background:var(--signal); border-radius:999px; transition:width .4s; }
    .fill.warn { background:var(--warn); } .fill.hot { background:var(--danger); }
    .p { width:44px; text-align:right; font-size:12px; font-variant-numeric:tabular-nums; }
    .p.na { color:var(--ink-mute); }
    .counts { display:flex; gap:8px; margin-top:8px; }
    .count { flex:1; background:var(--sunken); border-radius:10px; padding:9px 10px; }
    .count .c-l { font-size:11px; color:var(--ink-mute); display:flex; align-items:center; gap:5px; }
    .count .c-v { font-size:18px; font-weight:800; }
    .sw { width:8px; height:8px; border-radius:2px; } .sw.pii{background:var(--pii)} .sw.inj{background:var(--inj)}
    .more { display:block; width:100%; text-align:center; padding:9px; margin-top:12px; border:none; background:none; color:var(--signal); font-weight:600; font-size:13px; cursor:pointer; }
    .quit { display:block; width:100%; padding:9px; margin-top:4px; border:1px solid var(--line); border-radius:10px; background:none; color:var(--danger); font-weight:700; cursor:pointer; }
    .quit:hover { background:rgba(240,68,82,.08); }
  </style>
</head>
<body>
  <div class="pop">
    <div class="row">
      <div class="title">Up<span>Security</span></div>
      <label class="sec">
        <span id="sec-label">ON</span>
        <span class="switch"><input type="checkbox" id="sec-toggle" checked /><span class="slider"></span></span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="pill"><span class="nm">PII model</span><span class="st"><span class="dot" id="t-pii-dot"></span><span id="t-pii-label">—</span></span></div>
    <div class="pill"><span class="nm">INJECTION model</span><span class="st"><span class="dot" id="t-inj-dot"></span><span id="t-inj-label">—</span></span></div>

    <div class="divider"></div>

    <div id="t-res"></div>

    <div class="counts">
      <div class="count">
        <div class="c-l"><span class="sw pii"></span>PII 탐지 · 오늘</div>
        <div class="c-v" id="t-pii-today">–</div>
      </div>
      <div class="count">
        <div class="c-l"><span class="sw inj"></span>INJECTION · 오늘</div>
        <div class="c-v" id="t-inj-today">–</div>
      </div>
    </div>

    <button class="more" id="t-more">대시보드에서 더 자세히 보기 →</button>
    <button class="quit" id="t-quit">QUIT UpSecurity</button>
  </div>
  <script src="tray.js"></script>
</body>
</html>
