<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>UpSecurity</title>
  <style>
    /* Figma 파일 hMO6k051z9JXBoa2fWySND 노드 36:2846 "현황" 1:1 반영.
       색상은 Figma 캡처가 라이트 모드뿐이라 그대로, 다크 모드는 앱 본체(styles.css)와
       동일한 톤으로 자체 보완. 브랜드 퍼플(#584CDC)로 통일 — 기존엔 앱 어디에도 없는
       파란색(#3182F6)을 썼었다. */
    :root, [data-theme="light"] {
      --bg:rgba(235,245,252,.97); --card-bg:rgba(255,255,255,.88); --ink:#1F2937; --ink-mute:rgba(0,0,0,.5);
      --purple:#584CDC; --ok:#09AE4B; --danger:#F04452; --warn:#FF9500;
      --pii:#584CDC; --inj:#6A7282; --sunken:rgba(0,0,0,.08); --line:rgba(0,0,0,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:rgba(28,28,32,.97); --card-bg:rgba(255,255,255,.14); --ink:#F2F4F6; --ink-mute:rgba(255,255,255,.5);
        --purple:#8B7CFF; --ok:#28C08A; --danger:#FF5C6C; --warn:#FFB020; --pii:#8B7CFF; --inj:#9CA3AF;
        --sunken:rgba(255,255,255,.08); --line:rgba(255,255,255,.1); }
    }
    /* macOS 는 BrowserWindow 의 vibrancy(네이티브 프로스티드 글래스, main/tray.js)가 창
       뒤 데스크탑을 실제로 블러/채도 처리해서 보여준다 — body.mac-glass(js 로 플랫폼
       감지 후 부여) 일 때만 배경 알파를 기본값보다 살짝 낮춰 네이티브 효과가 비치게
       한다(그래도 "너무 투명하다"는 피드백을 반영해 처음보다는 훨씬 불투명하게 조정).
       Windows 는 vibrancy 가 없어 CSS backdrop-filter 가 유일한 블러 효과라 기본값(거의
       불투명)을 그대로 쓴다. */
    body.mac-glass { --bg:rgba(235,245,252,.82); --card-bg:rgba(255,255,255,.72); }
    @media (prefers-color-scheme: dark) {
      body.mac-glass { --bg:rgba(28,28,32,.8); --card-bg:rgba(255,255,255,.22); }
    }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:transparent; }
    body { font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
      color:var(--ink); font-size:12px; padding:8px; -webkit-font-smoothing:antialiased; }
    .pop { background:var(--bg); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.6);
      border-radius:16px; padding:14px; box-shadow:0 10px 40px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.5); }

    .header-row { display:flex; justify-content:flex-end; }
    .sec-toggle-wrap { display:inline-flex; cursor:pointer; }
    .sec-toggle-wrap input { position:absolute; opacity:0; width:0; height:0; }
    /* sec-pill 은 그 자체가 불투명한 배경을 가진 필(글자 포함)이라, dot 들처럼 pill
       자신에 ::before glow를 걸면 그 그라디언트가 pill 자신의 배경 위에(= 글자 위에)
       그려져 버린다(::before 도 pill 의 자식이라 pill 자기 배경보다는 나중에,
       하지만 pill 안의 진짜 텍스트보다는 먼저 그려지는데, 문제는 그라디언트 중심의
       불투명한 부분이 텍스트 대비를 해칠 정도로 진하다는 것). 그래서 glow는 배경이
       없는 바깥 래퍼(.sec-toggle-wrap)의 ::before로 걸어 맨 아래에 깔고, pill
       자신은 z-index로 그 위에 올려서 글자는 그대로 선명하게, 가장자리로 번지는
       빛만 pill 바깥으로 보이게 한다. */
    .sec-toggle-wrap { position:relative; }
    .sec-pill {
      position:relative; z-index:1;
      display:inline-flex; align-items:center; gap:8px; padding:5px 5px 5px 12px; border-radius:999px;
      background:var(--sunken); font-size:11px; font-weight:700; letter-spacing:.02em; color:var(--ink-mute);
      transition:background .2s;
    }
    .sec-toggle-wrap input:checked + .sec-pill { background:var(--ok); color:#fff; }
    .sec-knob { width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); flex:0 0 auto; }

    .divider { height:1px; background:var(--line); margin:12px 0; }
    .section-label { font-size:11px; font-weight:700; letter-spacing:.02em; color:var(--ink); margin-bottom:8px; }

    /* Figma 는 팝업이 카드 두 개 구조다 — 바깥 카드(.pop)엔 상단 Security ON 토글과
       하단 QUIT 만 직접 놓이고, ACTIVE MODEL/모델 pill/리소스 통계/"더 보기" 버튼은
       전부 그 안의 별도 카드(.inner-card, 자기 테두리·그림자·더 작은 radius)에 담긴다. */
    .outer-divider { height:1px; background:var(--line); margin:12px 0 10px; }
    .inner-card {
      background:var(--card-bg); border:1px solid rgba(255,255,255,.5); border-radius:12px;
      box-shadow:0 2px 10px rgba(0,0,0,.07), inset 0 1px 0 rgba(255,255,255,.6);
      padding:14px;
    }

    .model-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .model-count { font-size:10px; color:var(--ink-mute); margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .model-pill {
      display:inline-flex; align-items:center; gap:5px; padding:6px 10px; border-radius:999px;
      background:var(--card-bg); border:1px solid var(--line); font-size:11px; font-weight:600; color:var(--ink-mute);
    }
    /* mp-dot/sec-pill 의 glow는 앱 본체(styles.css)와 완전히 같은 keyframes/구조를 쓴다.
       중요한 실측 결과(styles.css의 "Ambient Glow" 섹션 주석에 자세히 남겨뒀다 — 다시
       이 삽질 하지 말 것): box-shadow는 이 환경에서 "값이 바뀌는" 모든 경우(keyframes,
       ::before, JS로 매 프레임 대입, 심지어 정적 값이어도 그 요소에 opacity<1/transform
       애니메이션이 걸리기만 해도)에 페인트가 전혀 안 된다. 실측으로 검증된 대안:
       box-shadow 대신 ::before에 background:radial-gradient() 로 halo를 그리고
       opacity/transform(scale)만 애니메이션하면 문제없이 그려진다.
       keyframes/구조는 styles.css의 것과 토씨 하나 안 틀리고 동일해야 한다(별도 파일
       공유는 이 환경에서 안정적으로 로드 안 되는 문제가 있었음 — 실측). 한쪽만 고치면
       트레이/앱 glow가 다시 갈리니 항상 같이 수정할 것(ambient-glow-a/b는 여기선 안
       쓰여서(앱 쪽 mc-dot/ps-dot/dot 전용) 안 넣었다 — mp-dot이 쓰는 ambient-glow-c만
       있으면 됨). */
    @keyframes ambient-glow-c {
      0%, 100% { opacity:.93; transform:translate(-50%,-50%) scale(1); }
      50% { opacity:1; transform:translate(-50%,-50%) scale(1.035); }
    }
    .model-pill .mp-dot {
      position:relative;
      width:6px; height:6px; border-radius:50%; background:var(--ink-mute); flex:0 0 auto;
      transition:background-color .8s ease-in-out;
    }
    .model-pill .mp-dot::before {
      content:''; position:absolute; left:50%; top:50%; width:56px; height:56px;
      transform:translate(-50%,-50%) scale(1);
      border-radius:9999px; pointer-events:none;
      opacity:0; transition:opacity .8s ease-in-out;
      /* styles.css와 동일하게 반경 축소(140→56px) + 점 근처 강도 상향(실측: 140px는
         필 테두리를 넘어 밖으로 번져 나갔음). */
      background:radial-gradient(circle,
        color-mix(in srgb, currentColor 55%, transparent) 0%,
        color-mix(in srgb, currentColor 22%, transparent) 25%,
        color-mix(in srgb, currentColor 6%, transparent) 55%,
        transparent 80%);
    }
    .model-pill.on { border-color:var(--purple); color:var(--purple); }
    .model-pill.on .mp-dot { background:var(--purple); color:var(--purple); }
    .model-pill.on .mp-dot::before {
      opacity:1;
      will-change:opacity, transform;
      animation:ambient-glow-c 6.3s ease-in-out infinite;
    }
    /* sec-pill은 켜지면 배경이 초록(var(--ok))이 되고 그 위에 흰 글자(color:#fff, 위 규칙)가
       올라가므로, currentColor 기반 gradient(위 ambient-glow-c 등)를 그대로 쓰면 halo
       색이 아니라 글자색까지 초록으로 덮어써서 흰 글자가 초록 배경에 묻힌다. 그래서 이
       요소만 currentColor 대신 var(--ok)를 직접 섞는다 — 겹 구조/증가 비율은 위
       ambient-glow-c와 동일. glow는 pill 자신이 아니라 배경 없는 바깥 래퍼
       (.sec-toggle-wrap)의 ::before에 걸어서 pill 자신의 불투명한 배경/글자 위로
       그려지지 않고 pill 바깥으로만 번지게 한다(위 .sec-pill 주석 참고) — pill이
       원형이 아니라 알약(가로로 긴 사각+둥근 모서리) 모양이라 그라디언트도 폭에 맞춰
       타원으로 키웠다(처음엔 240x120이었는데 pill 테두리를 넘어 밖으로 번져 나가서
       100x50으로 축소하고 점 근처 강도도 올렸다, dot 쪽과 동일한 조정 — 실측). */
    @keyframes ambient-glow-sec {
      0%, 100% { opacity:.93; transform:translate(-50%,-50%) scale(1); }
      50% { opacity:1; transform:translate(-50%,-50%) scale(1.035); }
    }
    .sec-toggle-wrap::before {
      content:''; position:absolute; left:50%; top:50%; width:100px; height:50px;
      transform:translate(-50%,-50%) scale(1);
      border-radius:9999px; pointer-events:none;
      opacity:0; transition:opacity .8s ease-in-out;
      background:radial-gradient(ellipse,
        color-mix(in srgb, var(--ok) 55%, transparent) 0%,
        color-mix(in srgb, var(--ok) 22%, transparent) 25%,
        color-mix(in srgb, var(--ok) 6%, transparent) 55%,
        transparent 80%);
    }
    .sec-toggle-wrap:has(input:checked)::before {
      opacity:1;
      will-change:opacity, transform;
      animation:ambient-glow-sec 5.8s ease-in-out infinite;
    }

    .res-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
    .res-block .rb-head { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
    .res-block .rb-icon { width:14px; height:14px; flex:0 0 14px; display:flex; align-items:center; justify-content:center; }
    .res-block .rb-icon img { max-width:100%; max-height:100%; object-fit:contain; }
    .res-block .rb-label { font-size:11px; font-weight:700; flex:1; }
    .res-block .rb-pct { font-size:11px; font-weight:700; color:var(--purple); }
    .res-block .rb-pct.na { color:var(--ink-mute); font-weight:600; }
    .res-block .rb-bar { height:4px; border-radius:999px; background:var(--sunken); overflow:hidden; margin-bottom:6px; }
    .res-block .rb-bar .fill { height:100%; background:var(--purple); border-radius:999px; transition:width .4s; }
    .res-block .rb-bar .fill.warn { background:var(--warn); } .res-block .rb-bar .fill.hot { background:var(--danger); }
    .res-block .rb-sub-item { display:flex; justify-content:space-between; font-size:9.5px; line-height:1.7; }
    .res-block .rb-sub-item .l { color:var(--ink-mute); }
    .res-block .rb-sub-item .v { color:var(--ink); font-weight:500; }

    .more {
      display:block; width:100%; text-align:center; padding:9px; margin-top:14px;
      border:1px solid var(--line); border-radius:10px; background:var(--card-bg);
      color:var(--ink); font-weight:600; font-size:11px; cursor:pointer;
    }
    .more:hover { background:var(--sunken); }
    .quit-row { display:flex; justify-content:flex-end; margin-top:8px; }
    .quit {
      border:none; background:none; padding:2px 0; color:var(--ink-mute); font-weight:700;
      font-size:9.5px; letter-spacing:.02em; text-decoration:underline; cursor:pointer;
      display:inline-flex; align-items:center; gap:4px;
    }
    .quit:hover { color:var(--danger); }
  </style>
</head>
<body>
  <div class="pop">
    <div class="header-row">
      <label class="sec-toggle-wrap">
        <input type="checkbox" id="sec-toggle" checked />
        <span class="sec-pill" id="sec-pill">
          <span id="sec-label">Security ON</span>
          <span class="sec-knob"></span>
        </span>
      </label>
    </div>

    <div class="outer-divider"></div>

    <div class="inner-card">
      <div class="section-label">ACTIVE MODEL</div>
      <div class="model-grid">
        <div class="model-col">
          <div class="model-count">PII 탐지 | 오늘 <span id="t-pii-today">0</span>건</div>
          <div class="model-pill" id="t-pii-pill"><span class="mp-dot" id="t-pii-dot"></span><span id="t-pii-label">PII model</span></div>
        </div>
        <div class="model-col">
          <div class="model-count">INJECTION 탐지 | 오늘 <span id="t-inj-today">0</span>건</div>
          <div class="model-pill" id="t-inj-pill"><span class="mp-dot" id="t-inj-dot"></span><span id="t-inj-label">INJECTION model</span></div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="res-grid" id="t-res"></div>

      <button class="more" id="t-more">대시보드에서 더 자세히 보기 →</button>
    </div>

    <div class="quit-row">
      <button class="quit" id="t-quit">QUIT UpSecurity</button>
    </div>
  </div>
  <script src="tray.js"></script>
</body>
</html>
