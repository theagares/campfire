<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campfire 문서 검토</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- 별 하나의 도형. 11번 반복되므로 정의는 한 번만 두고 <use> 로 참조한다.
       fill 은 상속되므로 색은 .star 쪽 CSS 가 정한다. -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="cf-star" viewBox="0 0 24 34">
      <path d="M12 0C13.2 11 15 15.5 24 17C15 18.5 13.2 23 12 34C10.8 23 9 18.5 0 17C9 15.5 10.8 11 12 0Z"/>
    </symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="doc-badge" id="doc-meta">
        <span class="doc-ico-wrap"><img src="assets/doc-icon.svg" alt="" /></span>
        <div class="doc-text">
          <div class="doc-name" id="doc-name">Campfire</div>
          <div class="doc-type" id="doc-type">문서 검토</div>
        </div>
      </div>
      <span class="counts" id="counts">검사 중…</span>
      <button class="close-btn" id="btn-close" title="닫기">×</button>
    </header>

    <!-- 진행 상태 (검사 중) -->
    <section class="view view-progress" id="view-progress">
      <!-- 검사 중 연출: 밤이 내리고(orb-bg) 별이 뜬 뒤(stars) 별똥별이 지나간다(shoot).
           별 좌표/크기는 목업(image/campfire.html)이 JS 로 만들던 값을 그대로 박아둔 것이다 —
           고정 값이라 런타임에 계산할 이유가 없다. --x/--y 는 중심 기준 오프셋, --w/--h 는
           원 지름 대비 비율이라 --orb 만 바꾸면 전체가 같이 스케일된다. -->
      <div class="orb">
        <div class="orb-bg"></div>
        <img class="art" src="assets/agent-shield.png" alt="" />
        <div class="stars" aria-hidden="true">
          <div class="star-set" style="--gd:0s">
            <svg viewBox="0 0 24 34" class="star" style="--x:11.00%;--y:-31.00%;--w:12.73%;--h:18.18%"><use href="#cf-star"/></svg>
            <svg viewBox="0 0 24 34" class="star" style="--x:-36.00%;--y:-15.00%;--w:10.74%;--h:15.34%"><use href="#cf-star"/></svg>
            <svg viewBox="0 0 24 34" class="star" style="--x:33.00%;--y:-4.00%;--w:11.93%;--h:17.05%"><use href="#cf-star"/></svg>
            <svg viewBox="0 0 24 34" class="star" style="--x:-27.00%;--y:2.00%;--w:9.15%;--h:13.07%"><use href="#cf-star"/></svg>
          </div>
          <div class="star-set" style="--gd:2.2s">
            <svg viewBox="0 0 24 34" class="star" style="--x:2.00%;--y:-30.00%;--w:11.14%;--h:15.91%"><use href="#cf-star"/></svg>
            <svg viewBox="0 0 24 34" class="star" style="--x:23.00%;--y:-23.50%;--w:9.55%;--h:13.64%"><use href="#cf-star"/></svg>
            <svg viewBox="0 0 24 34" class="star" style="--x:36.00%;--y:-8.00%;--w:12.33%;--h:17.61%"><use href="#cf-star"/></svg>
            <svg viewBox="0 0 24 34" class="star" style="--x:-31.50%;--y:-5.00%;--w:11.53%;--h:16.48%"><use href="#cf-star"/></svg>
          </div>
          <div class="star-set" style="--gd:4.4s">
            <svg viewBox="0 0 24 34" class="star" style="--x:16.00%;--y:-28.50%;--w:10.34%;--h:14.77%"><use href="#cf-star"/></svg>
            <svg viewBox="0 0 24 34" class="star" style="--x:-34.00%;--y:-11.00%;--w:11.93%;--h:17.05%"><use href="#cf-star"/></svg>
            <svg viewBox="0 0 24 34" class="star" style="--x:31.00%;--y:3.00%;--w:9.55%;--h:13.64%"><use href="#cf-star"/></svg>
          </div>
        </div>
        <div class="shoot-layer" aria-hidden="true">
          <div class="shoot"><img src="assets/shooting-star.png" alt="" /></div>
        </div>
      </div>
      <div class="pill-row">
        <div class="model-pill"><span class="mp-dot"></span>PII model</div>
        <div class="model-pill"><span class="mp-dot"></span>INJECTION model</div>
      </div>
      <h2 class="agent-title">Campfire</h2>
      <p class="progress-title" id="progress-title">문서 보안 분석 중…</p>
      <p class="progress-sub" id="progress-sub"></p>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <p class="warn-note" id="progress-warn" hidden></p>
    </section>

    <!-- 결과 (HITL 검토) — Figma #45:951 그대로: 문서가 화면 전체 높이를 차지하는
         본문(좌) + 탐지 항목 사이드바(우) 2컬럼 -->
    <section class="view view-result" id="view-result" hidden>
      <div class="result-layout">
        <div class="result-main">
          <div class="section-label">
            <span>문서 검토</span>
            <span class="legend">
              <span class="lg"><i class="sw sw-pii"></i>PII</span>
              <span class="lg"><i class="sw sw-inj"></i>인젝션</span>
            </span>
          </div>
          <p class="hint">표시된 부분을 누르면 마스킹이 풀리고, 다시 누르면 마스킹됩니다</p>
          <div class="diff" id="diff"></div>
        </div>
        <div class="result-side">
          <div class="section-label"><span>탐지 항목</span></div>
          <p class="hint">PII는 종류별로 묶어 한 번에 켜고 끕니다 · 눌러서 펼치면 개별 선택</p>
          <div class="items" id="items"></div>
        </div>
      </div>
    </section>

    <!-- 오류 / 미검사 통과 -->
    <section class="view view-error" id="view-error" hidden>
      <div class="err-icon">⚠️</div>
      <p class="err-title" id="err-title">검사하지 못했습니다</p>
      <p class="err-msg" id="err-msg"></p>
    </section>

    <footer class="footer" id="footer" hidden>
      <span class="mask-summary" id="mask-summary"></span>
      <button class="btn btn-cancel" id="btn-cancel">취소</button>
      <button class="btn btn-send" id="btn-send">전송</button>
    </footer>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
