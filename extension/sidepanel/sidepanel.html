<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>securedoc-gateway 문서 검토</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="doc-badge" id="doc-meta">
        <span class="doc-ico-wrap"><img src="assets/doc-icon.svg" alt="" /></span>
        <div class="doc-text">
          <div class="doc-name" id="doc-name">UpSecurity</div>
          <div class="doc-type" id="doc-type">문서 검토</div>
        </div>
      </div>
      <span class="counts" id="counts">검사 중…</span>
    </header>

    <!-- 진행 상태 (검사 중) -->
    <section class="view view-progress" id="view-progress">
      <img class="agent-icon" src="assets/agent-shield.png" alt="" />
      <div class="pill-row">
        <div class="model-pill"><span class="mp-dot"></span>PII model</div>
        <div class="model-pill"><span class="mp-dot"></span>INJECTION model</div>
      </div>
      <h2 class="agent-title">UpSecurity</h2>
      <p class="progress-title" id="progress-title">문서 보안 분석 중…</p>
      <p class="progress-sub" id="progress-sub"></p>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <p class="warn-note" id="progress-warn" hidden></p>
    </section>

    <!-- 결과 (HITL 검토) -->
    <section class="view view-result" id="view-result" hidden>
      <div class="section-label">
        <span>문서 검토</span>
        <span class="legend">
          <span class="lg"><i class="sw sw-pii"></i>PII</span>
          <span class="lg"><i class="sw sw-inj"></i>인젝션</span>
        </span>
      </div>
      <div class="diff" id="diff"></div>

      <div class="section-label">
        <span>탐지 항목</span>
        <span class="hint">토글을 끄면 마스킹에서 제외됩니다</span>
      </div>
      <div class="items" id="items"></div>
    </section>

    <!-- 오류 / 미검사 통과 -->
    <section class="view view-error" id="view-error" hidden>
      <div class="err-icon">⚠️</div>
      <p class="err-title" id="err-title">검사하지 못했습니다</p>
      <p class="err-msg" id="err-msg"></p>
    </section>

    <footer class="footer" id="footer" hidden>
      <span class="mask-summary" id="mask-summary"></span>
      <button class="btn btn-cancel" id="btn-cancel">취소</button>
      <button class="btn btn-send" id="btn-send">전송</button>
    </footer>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
