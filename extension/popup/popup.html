<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Campfire 설정</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="pop">
    <div class="header">
      <img class="brand-mark" src="../icons/icon48.png" alt="" aria-hidden="true">
      <div class="brand-copy">
        <h1>Campfire</h1>
        <p class="subtitle">설정</p>
      </div>
      <label class="toggle-wrap">
        <input type="checkbox" id="file-intercept-toggle" />
        <span class="toggle-pill" id="file-intercept-pill">
          <span id="file-intercept-label">OFF</span>
          <span class="toggle-knob"></span>
        </span>
      </label>
    </div>

    <div class="outer-divider"></div>

    <!-- 서버 설정 (읽기 전용) -->
    <div class="inner-card">
      <div class="section-label">서버 설정</div>
      <div class="row">
        <span class="row-label">연결 대상</span>
        <span class="row-value" id="target-value">확인 중…</span>
      </div>
      <div class="row">
        <span class="row-label">로컬 포트</span>
        <span class="row-value mono" id="port-value">—</span>
      </div>
      <button class="btn" id="rescan">서버 다시 탐지</button>
    </div>

    <!-- 앱 설정 -->
    <div class="inner-card">
      <div class="section-label">앱 설정</div>
      <div class="row">
        <span class="row-label">엔진 연결</span>
        <span class="status-pill" id="engine-pill"><span class="dot"></span><span id="engine-text">확인 중…</span></span>
      </div>
      <div id="engine-detail" class="engine-detail"></div>
      <button class="btn btn-primary" id="open-dashboard" disabled>대시보드 열기</button>
    </div>

    <div class="footer">PII · 프롬프트 인젝션 마스킹 게이트웨이</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
