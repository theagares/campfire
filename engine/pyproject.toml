[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securedoc-gateway-engine"
version = "0.1.0"
description = "securedoc-gateway 엔진 코어 (U1, Phase 0) — 로컬 우선 PII/프롬프트 인젝션 마스킹 게이트웨이"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "mcp>=1.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    # pyhwpx는 한/글(한컴오피스) 프로그램을 COM(pywin32)으로 자동화하는 방식이라
    # Windows 전용이다 — 다른 OS엔 설치 대상 wheel 자체가 없어 sys_platform 마커로
    # 조건부 의존성 처리한다. macOS/Linux에서는 HWPX만 "미지원 통과"로 우아하게
    # 저하되고(app/core/parser/hwpx.py의 ImportError 처리), 나머지 기능은 그대로 동작한다.
    "pyhwpx>=1.7 ; sys_platform == 'win32'",
    # 인젝션 LLM 실 모델(EXAONE-3.5-2.4B-Instruct + regularized MLP, PLAN §5 llm_mcp).
    # torch 는 GPU 빌드가 하드웨어(CUDA 버전)마다 달라 --index-url 로 별도 설치
    # 권장(예: https://download.pytorch.org/whl/cu128) — 여기 버전 제약은 최소 요건만.
    "torch>=2.3",
    "transformers>=4.51",
    "accelerate>=0.30",
    "numpy>=1.26",
    "safetensors>=0.4",
    # 인젝션 2단계 세부 위치 특정(Upstage Solar Pro 3 API 호출)용 비동기 HTTP 클라이언트.
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
