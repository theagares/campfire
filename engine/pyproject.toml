[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securedoc-gateway-engine"
version = "0.1.0"
description = "securedoc-gateway 엔진 코어 (U1, Phase 0) — 로컬 우선 PII/프롬프트 인젝션 마스킹 게이트웨이"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "mcp>=1.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pyhwpx>=1.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
